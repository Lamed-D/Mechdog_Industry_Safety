<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MechDog 관리자</title>
<style>
  :root { --bg:#f4f5f7; --card:#fff; --ink:#1d2330; --muted:#667085; --line:#d0d5dd;
          --ok:#12805c; --warn:#b54708; --bad:#c01048; --stop:#d92d20; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, "Malgun Gothic", sans-serif; background:var(--bg); color:var(--ink); }
  header { position:sticky; top:0; z-index:2; background:var(--card); border-bottom:1px solid var(--line);
           padding:12px 16px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  #estop { background:var(--stop); color:#fff; border:0; border-radius:10px; font-size:24px; font-weight:800;
           padding:18px 28px; min-width:240px; cursor:pointer; box-shadow:0 2px 0 #7a271a; }
  #estop:active { transform:translateY(2px); box-shadow:none; }
  #phase { font-size:18px; font-weight:700; }
  #conn { margin-left:auto; font-size:14px; }
  main { padding:16px; display:grid; gap:16px; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); }
  section { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; min-width:0; }
  h2 { margin:0 0 10px; font-size:16px; }
  .row { display:flex; justify-content:space-between; gap:8px; padding:3px 0; font-size:14px; }
  .muted { color:var(--muted); }
  .ok { color:var(--ok); font-weight:700; } .warn { color:var(--warn); font-weight:700; } .bad { color:var(--bad); font-weight:700; }
  button.op { border:1px solid var(--line); background:#fff; border-radius:8px; padding:10px 12px; font-size:14px; cursor:pointer; margin:4px 4px 0 0; }
  .alert { border-left:4px solid var(--bad); padding:6px 10px; margin:6px 0; background:#fff1f3; font-size:14px; }
  .alert.check { border-color:var(--warn); background:#fffaeb; }
  .alert.done { border-color:var(--line); background:#f9fafb; color:var(--muted); }
  #notices { font-size:13px; max-height:320px; overflow:auto; margin:0; padding-left:18px; }
  #msg { font-size:14px; }
  input { padding:6px; border:1px solid var(--line); border-radius:6px; width:140px; }
</style>
</head>
<body>
<header>
  <button id="estop" type="button">■ 전체 정지</button>
  <div>
    <div id="phase">단계: -</div>
    <div id="msg" class="muted">연결 중…</div>
  </div>
  <div id="conn">조작 토큰 <input id="token" type="password" autocomplete="off" placeholder="(설정한 경우)"></div>
</header>
<main>
  <section id="robots"><h2>로봇</h2><div id="robot-list"></div></section>
  <section>
    <h2>알림</h2>
    <div id="alerts" class="muted">알림 없음</div>
    <div>
      <button class="op" data-event="operator_ack">알림 확인</button>
      <button class="op" data-event="start_guide">안내 시작</button>
      <button class="op" data-event="guide_clear">안내 재개</button>
      <button class="op" data-event="retry">다시 시도</button>
      <button class="op" data-event="resolved">조치 완료</button>
      <button class="op" data-event="start_patrol">순찰 시작</button>
    </div>
  </section>
  <section><h2>최근 기록</h2><ol id="notices" reversed></ol></section>
</main>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const PHASE = {standby:"대기", patrol:"순찰", alert:"발견·알림", dispatch:"호출·이동", at_manager:"관리자 앞",
  guiding:"안내 중", on_site:"사고 지점", returning:"복귀", suspended:"멈춤(사람 확인 필요)", estop:"전체 정지"};
let token = "";
try { token = sessionStorage.getItem("dash-token") || ""; $("token").value = token; } catch (e) {}
$("token").addEventListener("change", () => { token = $("token").value; try { sessionStorage.setItem("dash-token", token); } catch (e) {} });

async function post(path, body) {
  const headers = {"Content-Type": "application/json"};
  if (token) headers["X-Dashboard-Token"] = token;
  const r = await fetch(path, {method: "POST", headers, body: JSON.stringify(body || {})});
  return r.json().catch(() => ({ok: false, reason: "http_" + r.status}));
}
function show(text, cls) { $("msg").textContent = text; $("msg").className = cls || "muted"; }

// 전체 정지: 확인 창 없이 바로. 실패하면 크게 표시하고 한 번 더 보냅니다.
$("estop").addEventListener("click", async () => {
  show("전체 정지 보내는 중…", "bad");
  for (let i = 0; i < 2; i++) {
    try {
      const r = await post("/api/estop");
      if (r.ok) { show("전체 정지 완료: " + r.sent.join(", "), "bad"); return; }
      show("전체 정지 일부 실패: " + JSON.stringify(r.errors) + " — 로봇 근처 전원 차단 준비", "bad");
    } catch (e) { show("전체 정지 전송 실패(서버 연결 없음) — 로봇은 0.6초 뒤 스스로 멈춤, 전원 차단 준비", "bad"); }
  }
});
document.querySelectorAll("button.op").forEach((b) => b.addEventListener("click", async () => {
  const r = await post("/api/operator", {event: b.dataset.event});
  show(r.ok ? b.textContent + " 완료" : b.textContent + " 거부: " + esc(JSON.stringify(r.reason)), r.ok ? "ok" : "warn");
}));
async function resetLatch(robot) {
  if (!confirm("로봇 " + robot + " 래치를 해제합니다. 주변이 안전하고 로봇을 지켜보고 있습니까?")) return;
  const r = await post("/api/reset", {robot, confirmed: true});
  show(r.ok ? robot + " 래치 해제 요청 보냄(텔레메트리로 확인)" : robot + " 래치 해제 거부: " + esc(r.reason), r.ok ? "ok" : "warn");
}

function linkCls(v) { return v === "ok" ? "ok" : v === "stale" ? "warn" : "bad"; }
function render(s) {
  $("phase").textContent = "단계: " + (PHASE[s.phase] || s.phase);
  $("robot-list").innerHTML = ["A", "B"].map((r) => {
    const v = s.robots[r];
    return `<div style="margin-bottom:10px"><b>로봇 ${r}</b>
      <div class="row"><span>통신</span><span class="${linkCls(v.link)}">${esc(v.link)}${v.last_seen_age_s != null ? " (" + v.last_seen_age_s + "초 전)" : ""}</span></div>
      <div class="row"><span>상태</span><span>${esc(v.state)}</span></div>
      <div class="row"><span>통신 역할</span><span>${esc(({primary:"주 로봇",secondary:"보조 로봇",none:"미지정"})[v.role] || "확인 중")}</span></div>
      <div class="row"><span>래치</span><span class="${v.latched ? "bad" : "ok"}">${v.latched == null ? "?" : v.latched ? "잠김(" + esc(v.reason) + ")" : "풀림"}</span></div>
      <div class="row"><span>배터리</span><span>${v.battery_mv == null ? "모름" : (v.battery_mv / 1000).toFixed(2) + " V"}</span></div>
      <div class="row"><span>카메라</span><span class="${v.camera === "streaming" ? "ok" : "warn"}">${esc(v.camera)}</span></div>
      <div class="row"><span>시나리오 활동</span><span>${esc(s.scenario.activity[r])}</span></div>
      <button class="op" onclick="resetLatch('${r}')">래치 해제…</button></div>`;
  }).join("");
  $("alerts").innerHTML = s.alerts.length ? s.alerts.slice().reverse().map((a) => {
    const cls = a.state === "resolved" ? "done" : a.needs_check ? "check" : "";
    const when = new Date(a.wall_time * 1000).toLocaleTimeString();
    return `<div class="alert ${cls}">#${a.id} 로봇 ${esc(a.robot)} · 구역 ${esc(a.zone)} · ${when}<br>
      ${a.needs_check ? "<b>확인 필요</b> · " : ""}신뢰도 ${a.confidence == null ? "?" : Number(a.confidence).toFixed(2)}
      · 근거 ${esc(a.source)} · ${a.acked ? "확인함" : "미확인"} · ${a.state === "resolved" ? "조치 완료" : "진행 중"}</div>`;
  }).join("") : "알림 없음";
  $("notices").innerHTML = s.notices.slice(-40).reverse().map((n) =>
    `<li>${new Date(n.wall_time * 1000).toLocaleTimeString()} ${esc(n.kind)}${n.robot ? " [" + esc(n.robot) + "]" : ""} <span class="muted">${esc(JSON.stringify(n.detail))}</span></li>`).join("");
  if (s.log_failures) show("기록 실패 " + s.log_failures + "회 — 기록 파일 확인", "warn");
}
let failures = 0;
async function poll() {
  try {
    const r = await fetch("/api/state", {cache: "no-store"});
    render(await r.json());
    if (failures) show("서버 연결 복구", "ok");
    failures = 0;
  } catch (e) {
    failures++;
    show("서버 연결 끊김 — 화면 정보가 오래됨. 로봇은 통신이 끊기면 스스로 멈춤", "bad");
  }
  setTimeout(poll, 200);
}
poll();
</script>
</body>
</html>
